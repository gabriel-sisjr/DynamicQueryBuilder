name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    # The required status check matches this exact name. Keep it unique across
    # all workflows and independent of any matrix value.
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (8 & 9)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore DynamicQueryBuilder.sln

      - name: Build
        run: dotnet build DynamicQueryBuilder.sln -c Release --no-restore

      - name: Test
        # TreatNoTestsAsError: a run that discovers zero tests fails instead of passing.
        run: dotnet test DynamicQueryBuilder.sln -c Release --no-build --logger "console;verbosity=normal" -- RunConfiguration.TreatNoTestsAsError=true
