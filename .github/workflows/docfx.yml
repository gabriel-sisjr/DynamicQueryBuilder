name: Build and Deploy DocFX

on:
  push:
    branches:
      - develop # TODO: Change to main in the future.
  pull_request:
    branches:
      - develop # TODO: Change to main in the future.

permissions:
  contents: read

# One run per ref at a time. A new PR run cancels the older run of the same PR.
# Push runs (the only ones that deploy) never cancel a run in progress. A newer
# push may replace an older run that is still pending; if an older deploy lands
# last anyway, the next push re-deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (8 & 9)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore DocFX (version pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Restore Dependencies
        run: dotnet restore

      # Warnings fail the build: an empty API build would otherwise exit 0, and the
      # deploy's `clean: true` would then wipe the live API pages.
      - name: Build Documentation
        run: dotnet docfx docfx.json --warningsAsErrors

      - name: Upload Artifact (for debugging)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docfx-site
          path: _site

  deploy:
    # develop is the publishing branch: only a push to it deploys. Pull requests
    # still build the docs above as validation, but never publish.
    # Revisited in F1-01 (branch model).
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch

    steps:
      # The deploy action authenticates with its own `token` input (default:
      # github.token) and resets the remote itself, so the checkout keeps no credentials.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Built Docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docfx-site
          path: _site

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean: true
